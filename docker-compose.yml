version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: tradeledger-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: tradeledger_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - tradeledger-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tradeledger_db"]
      timeout: 10s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tradeledger-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:rootpassword@db:5432/tradeledger_db?schema=public
      - DIRECT_URL=postgresql://postgres:rootpassword@db:5432/tradeledger_db?schema=public
      - JWT_ACCESS_SECRET=9a8b7c6d5e4f3g2h1i0j_access_key_xyz_789
      - JWT_REFRESH_SECRET=0j1i2h3g4f5e6d7c8b9a_refresh_key_xyz_987
      - CORS_ORIGIN=http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tradeledger-network

networks:
  tradeledger-network:
    driver: bridge

volumes:
  pg_data:
